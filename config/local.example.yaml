# Copia este archivo como config/local.yaml y cambia solamente lo necesario.
# local.yaml está ignorado por Git y se combina con config/default.yaml.

whisper:
  # faster-whisper descarga automáticamente los modelos compatibles.
  model: large-v3-turbo
  device: cuda
  compute_type: float16

ollama:
  # Antes de cambiarlo, ejecuta: ollama pull <nombre-del-modelo>
  model: qwen3:8b
  host: http://127.0.0.1:11434

cosyvoice:
  # Debe ser un checkpoint compatible con el AutoModel y el método
  # inference_cross_lingual de la versión de CosyVoice instalada.
  model_id: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
  repo_dir: ~/.local/share/gtaiv-latam-ai-dubber/repos/CosyVoice
  model_dir: ~/.local/share/gtaiv-latam-ai-dubber/models/Fun-CosyVoice3-0.5B
  device: cuda

demucs:
  # htdemucs_ft puede mejorar algunos casos, pero tarda bastante más.
  model: htdemucs
  device: cuda

speaker_separation:
  # SepFormer separa hasta dos voces simultáneas. Desactivado: en las escenas
  # del juego inventaba frases y juntaba conversaciones enteras en una voz (ver
  # README). CPU es más lento pero no compite por VRAM.
  enabled: false
  model_id: speechbrain/sepformer-wsj02mix
  model_dir: ~/.local/share/gtaiv-latam-ai-dubber/models/sepformer-wsj02mix
  device: cpu

diarization:
  # Corta las intervenciones sólo en finales de frase y agrupa por personaje.
  # Pon backend spectral si prefieres no descargar ECAPA; baja
  # distance_threshold si dos personajes distintos quedan mezclados, súbelo si
  # uno se parte en dos.
  enabled: true
  backend: ecapa
  device: cpu
  distance_threshold: 0.75
  max_speakers: 8
  split_turns: false
  split_sentences: true
  min_cluster_seconds: 1.5

audio:
  output_bit_depth: 16
  peak_limit_dbfs: -1.0
