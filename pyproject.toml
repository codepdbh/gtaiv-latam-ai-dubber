[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtaiv-latam-ai-dubber"
version = "0.1.0"
description = "Pipeline local de doblaje latino para WAV extraídos de GTA IV"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0.2",
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1.0",
  "demucs>=4.0.1",
  "huggingface-hub>=0.27",
]
gui = ["PySide6>=6.7"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
gtaiv-dubber = "gtaiv_dubber.__main__:main"

[tool.setuptools.packages.find]
include = ["gtaiv_dubber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

